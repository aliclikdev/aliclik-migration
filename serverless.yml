service: aliclik-migration

frameworkVersion: '3'

useDotenv: true

provider:
  name: aws
  runtime: nodejs20.x
  region: ${env:AWS_REGION, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 30
  memorySize: 512
  environment:
    PRISMA_QUERY_ENGINE_LIBRARY: /var/task/libquery_engine-rhel-openssl-3.0.x.so.node
    DATABASE_URL: ${env:DATABASE_URL, ''}
    AURORA_DATABASE_URL: ${env:AURORA_DATABASE_URL, ''}
    NODE_ENV: ${env:NODE_ENV, 'development'}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    SQS_QUEUE_URL: ${env:SQS_QUEUE_URL}
    SQS_DLQ_URL: ${env:SQS_DLQ_URL}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:SendMessage
          Resource:
            - ${env:SQS_QUEUE_ARN}
            - ${env:SQS_DLQ_ARN}

plugins:
  - serverless-esbuild
  - serverless-offline
  - serverless-dotenv-plugin

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node20
    packager: pnpm

package:
  individually: false
  patterns:
    - 'libquery_engine-rhel-openssl-3.0.x.so.node'
    - 'prisma/schema.prisma'

functions:
  processSqsMigration:
    handler: src/handlers/processSqsMigration.handler
    vpc:
      securityGroupIds:
        - ${env:AURORA_SECURITY_GROUP_ID}
      subnetIds:
        - ${env:SUBNET_PRIVATE_1}
        - ${env:SUBNET_PRIVATE_2}
    events:
      - sqs:
          arn: ${env:SQS_QUEUE_ARN}
          batchSize: 10
          maximumBatchingWindow: 60
          functionResponseType: ReportBatchItemFailures