service: aliclik-migration
frameworkVersion: '3'
useDotenv: true

plugins:
  - serverless-esbuild
  - serverless-dotenv-plugin

custom:
  region: ${env:AWS_REGION}
  dotenv:
    path: .env
  esbuild:
    bundle: true
    minify: true
    target: 'node20'
    platform: 'node'
    sourcemap: false
    external:
      - '@aws-sdk/*'
      - '@prisma/client'
      - 'sharp'
      - 'dotenv'

package:
  individually: true

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  timeout: 30
  memorySize: 512
  environment:
    PRISMA_QUERY_ENGINE_LIBRARY: /var/task/libquery_engine-rhel-openssl-3.0.x.so.node
    AURORA_DATABASE_URL: ${env:AURORA_DATABASE_URL}
    NODE_ENV: ${env:NODE_ENV}
    LOG_LEVEL: ${env:LOG_LEVEL}
    SQS_QUEUE_URL: ${env:SQS_QUEUE_URL}
    SQS_DLQ_URL: ${env:SQS_DLQ_URL}
    AWS_S3_BUCKET: ${env:AWS_S3_BUCKET}
    STAGING_PREFIX: 'staging/'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - Fn::GetAtt:
                - ImageMigrationQueue
                - Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - Fn::Join:
                - ''
                - - 'arn:aws:s3:::'
                  - ${env:AWS_S3_BUCKET}
                  - '/*'

functions:
  processSqsMigration:
    handler: src/sqs/processSqsMigration.handler
    events:
      - sqs:
          arn: ${env:SQS_QUEUE_ARN}
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

  processImageMigration:
    handler: src/sqs/processImageMigration.handler
    timeout: 120
    memorySize: 1024
    environment:
      AWS_S3_BUCKET: ${env:AWS_S3_BUCKET}
      STAGING_PREFIX: 'staging/'
      AURORA_DATABASE_URL: ${env:AURORA_DATABASE_URL}
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - ImageMigrationQueue
              - Arn
          batchSize: 3
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    ImageMigrationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-image-migration
        VisibilityTimeout: 180
        MessageRetentionPeriod: 1209600
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - ImageMigrationDLQ
              - Arn
          maxReceiveCount: 3

    ImageMigrationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-image-migration-dlq
        MessageRetentionPeriod: 1209600

  Outputs:
    ImageMigrationQueueUrl:
      Value:
        Ref: ImageMigrationQueue
      Export:
        Name: ${self:service}-${self:provider.stage}-image-migration-queue-url