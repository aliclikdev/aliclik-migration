service: aliclik-migration
frameworkVersion: '3'
useDotenv: true

custom:
  region: ${env:AWS_REGION, 'us-east-1'}
  esbuild:
    bundle: true
    minify: false
    target: 'node20'
    platform: 'node'
    sourcemap: false
    external:
      - '@prisma/client'  # Prisma debe ser externo
      - 'sharp'           # Sharp debe ser externo (binario nativo)
    packager: 'pnpm'
    packagerOptions:
      scripts:
        - prisma generate
    exclude:
      - '!node_modules/.pnpm/**'  # Excluir estructura anidada de pnpm

package:
  individually: true  # ← Empaquetar cada función por separado

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1                    # ← string literal (evita warning)
  stage: ${opt:stage, 'dev'}
  timeout: 30
  memorySize: 512
  environment:
    PRISMA_QUERY_ENGINE_LIBRARY: /var/task/libquery_engine-rhel-openssl-3.0.x.so.node
    DATABASE_URL: ${env:DATABASE_URL, ''}
    AURORA_DATABASE_URL: ${env:AURORA_DATABASE_URL, ''}
    NODE_ENV: ${env:NODE_ENV, 'development'}
    LOG_LEVEL: ${env:LOG_LEVEL, 'info'}
    SQS_QUEUE_URL: ${env:SQS_QUEUE_URL}
    SQS_DLQ_URL: ${env:SQS_DLQ_URL}
    AWS_S3_BUCKET: ${env:AWS_S3_BUCKET, 'product-aliclik'}
    STAGING_PREFIX: 'staging/'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - sqs:ReceiveMessage
            - sqs:DeleteMessage
            - sqs:GetQueueAttributes
            - sqs:ChangeMessageVisibility
          Resource:
            - Fn::GetAtt:              # ← sintaxis larga
                - ImageMigrationQueue
                - Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
          Resource:
            - Fn::Join:                # ← sintaxis larga para arn
                - ''
                - - 'arn:aws:s3:::'
                  - ${env:AWS_S3_BUCKET, 'product-aliclik'}
                  - '/*'

functions:
  processSqsMigration:
    handler: dist/handlers/processSqsMigration.handler
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - MigrationQueue
              - Arn
          batchSize: 5
          functionResponseType: ReportBatchItemFailures

  processImageMigration:
    handler: dist/handlers/processImageMigration.handler
    timeout: 120
    memorySize: 1024
    environment:
      AWS_S3_BUCKET: ${env:AWS_S3_BUCKET, 'product-aliclik'}
      AWS_REGION: us-east-1
      STAGING_PREFIX: 'staging/'
      AURORA_DATABASE_URL: ${env:AURORA_DATABASE_URL}
    events:
      - sqs:
          arn:
            Fn::GetAtt:
              - ImageMigrationQueue
              - Arn
          batchSize: 3
          functionResponseType: ReportBatchItemFailures

resources:
  Resources:
    ImageMigrationQueue:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-image-migration
        VisibilityTimeout: 180
        MessageRetentionPeriod: 1209600
        RedrivePolicy:
          deadLetterTargetArn:
            Fn::GetAtt:
              - ImageMigrationDLQ
              - Arn
          maxReceiveCount: 3

    ImageMigrationDLQ:
      Type: AWS::SQS::Queue
      Properties:
        QueueName: ${self:service}-${self:provider.stage}-image-migration-dlq
        MessageRetentionPeriod: 1209600

  Outputs:
    ImageMigrationQueueUrl:
      Value:
        Ref: ImageMigrationQueue       # ← sintaxis larga
      Export:
        Name: ${self:service}-${self:provider.stage}-image-migration-queue-url

